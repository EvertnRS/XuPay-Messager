services:
  postgres:
    image: postgres:16
    container_name: xupay_message_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: xupay_message_db
    ports:
      - "3010:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: